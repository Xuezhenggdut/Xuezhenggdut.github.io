name: Update Scholar Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update publication data
        run: python scripts/update_scholar_publications.py --user QMijGnwAAAAJ --lang zh-CN

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain _data/publications.yml)" ]]; then
            echo "No publication changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "chore: auto-update publications from Google Scholar"
          git push
